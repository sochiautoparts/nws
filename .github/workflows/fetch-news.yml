name: Fetch Automotive News

# Two-mode refresh so bots can post news as it arrives:
#   - tier1 (every 10 min): fast lane over ~45 high-volume feeds, merged into
#     existing JSON — fresh stories appear in data/*.json within ~10-15 min.
#   - full (hourly): complete parse of ALL sources, regenerates the files.
on:
  schedule:
    # Fallback only — GitHub throttles free-account schedules to 1-2h.
    # The real 10-min cadence comes from self-perpetuation (see last step).
    # Fast lane: every 10 minutes (offset from full runs)
    - cron: "*/10 * * * *"
    # Full parse: hourly at minute 37
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode: tier1 (fast, ~45 feeds) or full (all feeds)"
        required: false
        default: "full"
        type: choice
        options:
          - tier1
          - full
  push:
    branches: [main]
    paths:
      - "fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/fetch-news.yml"

# Push trigger only fires on code changes (not on JSON-only commits), so we
# don't get an infinite loop. Tier1 runs skip commits entirely when no new
# items were found, so the repo doesn't get commit spam.

permissions:
  contents: write       # Required to commit JSON files back to repo
  actions: write        # Required to self-dispatch the next run (self-perpetuation)

concurrency:
  group: fetch-news
  # cancel-in-progress: false → queued runs wait for the current one to finish,
  # avoiding race conditions on the git push step.
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # dispatch → use inputs.mode; hourly cron (37) → full; everything else → tier1
      NWS_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '37 * * * *' && 'full' || 'tier1') }}

    steps:
      # Очередь не копится: если другой ран активен/в очереди — выходим сразу.
      # Цепочку продолжает активный ран (он сам вызовет следующий dispatch).
      - name: Skip if another run is active or queued (no queue buildup)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ACTIVE=$(curl -s -H "Authorization: token $GH_TOKEN"
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=15"
          | python3 -c "import sys,json;current=int(sys.argv[1]);d=json.load(sys.stdin);others=[r for r in d.get('workflow_runs',[]) if r['id']!=current and r['path']=='.github/workflows/fetch-news.yml' and r['status'] in ('in_progress','queued','waiting','pending')];print(len(others))" ${{ github.run_id }});
          if [ "$ACTIVE" -gt 0 ]; then echo "Another fetch-news run is active/queued ($ACTIVE) — skipping."; exit 0; else echo "No other runs — proceeding."; fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news parser
        run: |
          echo "NWS_MODE=${NWS_MODE}"
          python fetch_news.py

      - name: Show summary
        if: env.NWS_MODE == 'full'
        run: |
          echo "=== BMW news ==="
          python -c "import json;d=json.load(open('data/bmw-news.json'));print(f'items: {d[\"total_items\"]}, sources: {d[\"sources_count\"]}')"
          echo "=== Auto news ==="
          python -c "import json;d=json.load(open('data/auto-news.json'));print(f'items: {d[\"total_items\"]}, sources: {d[\"sources_count\"]}')"

      - name: Commit & push JSON files
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the data files (don't accidentally commit logs etc.)
          git add data/bmw-news.json data/auto-news.json

          if git diff --staged --quiet; then
            echo "No changes to commit — JSON files are identical to last run."
            exit 0
          fi

          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          BMW_COUNT="$(python -c "import json;print(json.load(open('data/bmw-news.json'))['total_items'])")"
          AUTO_COUNT="$(python -c "import json;print(json.load(open('data/auto-news.json'))['total_items'])")"
          git commit -m "chore(news): ${NWS_MODE:-full} refresh @ ${TIMESTAMP}

          - BMW news: ${BMW_COUNT} items
          - Auto news: ${AUTO_COUNT} items"

          # Push with retry. If the remote moved (another concurrent run pushed
          # first), we rebase and prefer OUR freshly-generated JSON for any
          # conflicts (-X theirs in rebase = the commit being replayed wins).
          for attempt in 1 2 3; do
            echo "--- Push attempt $attempt ---"
            if git pull --rebase -X theirs origin main; then
              :
            else
              echo "✗ Pull-rebase failed unexpectedly"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            if git push; then
              echo "✓ Pushed updated JSON files"
              exit 0
            fi
            echo "Push rejected, retrying in 5s..."
            sleep 5
          done
          echo "✗ Failed to push after 3 attempts — another run will refresh soon."
          exit 1

      # ─── Self-perpetuation: GitHub троттлит schedule (реально 1-2ч вместо 10мин).
      # Поэтому ран сам вызывает следующий tier1 через dispatch API — диспетч-
      # запуски не троттлятся. Цикл: parse+commit (~2-4 мин) → пауза → dispatch.
      # Цепь падает? Cron-фоллбеки выше пересеют её. Пуш в main тоже пересеет.
      - name: Self-perpetuate next tier1 run (bypasses schedule throttling)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${NWS_MODE}" = "tier1" ]; then
            echo "tier1 done — pausing 4 min to keep ~10-min cadence..."
            sleep 240
          else
            echo "full done — continuing tier1 chain immediately"
            sleep 30
          fi
          for i in 1 2 3; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fetch-news.yml/dispatches" \
              -d '{"ref":"main","inputs":{"mode":"tier1"}}')
            if [ "$HTTP" = "204" ]; then echo "✅ Next tier1 run dispatched (attempt $i)"; exit 0; fi
            echo "⚠️ Dispatch attempt $i failed (HTTP $HTTP), retrying..."; sleep 15
          done
          echo "⚠️ Self-dispatch failed — cron fallback will re-seed the chain."
